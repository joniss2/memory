# Variante mit getrennter Datenbank -- für alle, die Postgres ohnehin
# betreiben. Der Regelfall ist das einzelne Image aus dem Dockerfile.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: provenance
      POSTGRES_PASSWORD: provenance
      POSTGRES_DB: provenance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provenance"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      PROVENANCE_EMBEDDED_POSTGRES: "0"
      PROVENANCE_DATABASE_URL: postgresql://provenance:provenance@db:5432/provenance
      PROVENANCE_LLM_PROVIDER: ${PROVENANCE_LLM_PROVIDER:-heuristic}
      PROVENANCE_LLM_BASE_URL: ${PROVENANCE_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      # Die Vorgabe oben zeigt über die Docker-Brücke auf den eigenen Rechner.
      # Das ist kein Loopback, also lehnt die Transportprüfung sie ohne diesen
      # Schalter ab -- und der dokumentierte Weg zum lokalen Modell scheiterte
      # schon vor dem ersten Aufruf. Wer stattdessen ein Modell über das Netz
      # anspricht, setzt hier false und eine https-Adresse.
      PROVENANCE_LLM_ALLOW_INSECURE_HTTP: ${PROVENANCE_LLM_ALLOW_INSECURE_HTTP:-true}
      PROVENANCE_API_TOKEN: ${PROVENANCE_API_TOKEN:-}
      PROVENANCE_ALLOW_UNAUTHENTICATED: ${PROVENANCE_ALLOW_UNAUTHENTICATED:-false}
    extra_hosts:
      # Unter nativem Linux gibt es host.docker.internal sonst nicht, und der
      # lokale Modellpfad scheitert schon an der Namensauflösung.
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
